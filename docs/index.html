<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0B0E; }
  body { font-family: "Manrope", system-ui, sans-serif; color: #EDEFF4; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(61,220,151,.3); }
  .lolscroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .lolscroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.10); border-radius: 20px; border: 2px solid transparent; background-clip: padding-box; }
  .lolscroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.20); background-clip: padding-box; }
  .lolscroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.20) transparent; }
  @keyframes lolFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .lol-card-wrap { content-visibility: auto; contain-intrinsic-size: auto 240px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
  @keyframes lolPop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes lolSpin { to { transform: rotate(360deg); } }
  @keyframes lolBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes lolGlow { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  @keyframes lolLock { 0% { box-shadow: inset 0 0 0 3px rgba(90,220,255,.95); } 100% { box-shadow: inset 0 0 0 1px rgba(90,200,255,.25); } }
</style>
</head>
